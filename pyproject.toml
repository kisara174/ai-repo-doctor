[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-doctor"
dynamic = ["version"]
description = "Evidence-first Python repository analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[tool.setuptools.dynamic]
version = {attr = "repo_doctor._version.__version__"}

[tool.setuptools.packages.find]
include = ["repo_doctor*"]

[tool.setuptools.package-data]
repo_doctor = ["resources/skill/*.md", "resources/map/*"]
