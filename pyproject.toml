[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-doctor"
dynamic = ["version"]
description = "Static source evidence and offline maps for Python and optional JavaScript/TypeScript repositories"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kisara174/ai-repo-doctor"
Repository = "https://github.com/kisara174/ai-repo-doctor"
Issues = "https://github.com/kisara174/ai-repo-doctor/issues"
Changelog = "https://github.com/kisara174/ai-repo-doctor/blob/codex/repo-doctor-v1/CHANGELOG.md"

[project.optional-dependencies]
js = ["tree-sitter==0.26.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[tool.setuptools.dynamic]
version = {attr = "repo_doctor._version.__version__"}

[tool.setuptools.packages.find]
include = ["repo_doctor*"]

[tool.setuptools.package-data]
repo_doctor = ["resources/skill/*.md", "resources/map/*"]
