[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-doctor"
version = "0.1.0"
description = "Evidence-first Python repository analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["repo_doctor*"]
