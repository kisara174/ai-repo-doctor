name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile project modules
        run: python -m compileall -q repo_doctor tools

      - name: Check CLI help
        run: python -m repo_doctor --help

      - name: Check diagnosis CLI help
        run: python -m repo_doctor diagnose --help

      - name: Check diagnosis evaluation CLI help
        run: |
          python -m tools.evaluate_diagnosis prepare --help
          python -m tools.evaluate_diagnosis run --help
          python -m tools.evaluate_diagnosis prepare-review --help
          python -m tools.evaluate_diagnosis score --help
