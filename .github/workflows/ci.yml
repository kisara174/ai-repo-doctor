name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-grammars:
    uses: ./.github/workflows/native-grammars.yml

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check maintained public instructions
        run: python tools/check_public_docs.py --root .

      - name: Record runner identity
        run: |
          uname -a
          python -c "import json,platform,sys; print(json.dumps({'python':sys.version,'platform':platform.platform(),'machine':platform.machine()}))" > "$RUNNER_TEMP/machine.json"
          cat "$RUNNER_TEMP/machine.json"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile project modules
        run: python -m compileall -q repo_doctor tools

      - name: Check CLI help
        run: python -m repo_doctor --help

      - name: Check diagnosis CLI help
        run: python -m repo_doctor diagnose --help

      - name: Check diagnosis evaluation CLI help
        run: |
          python -m tools.evaluate_diagnosis prepare --help
          python -m tools.evaluate_diagnosis run --help
          python -m tools.evaluate_diagnosis prepare-review --help
          python -m tools.evaluate_diagnosis score --help

      - name: Build and smoke-test installed wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          RD_EXPECTED_VERSION="$(python -c 'from repo_doctor._version import __version__; print(__version__)')"
          python -m venv "$RUNNER_TEMP/repo-doctor-venv"
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" -m pip install --no-index dist/*.whl
          mkdir "$RUNNER_TEMP/repo-doctor-sample"
          printf 'def answer():\n    return 42\n' > "$RUNNER_TEMP/repo-doctor-sample/app.py"
          printf '[]\n' > "$RUNNER_TEMP/findings.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" --help
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" scan repo-doctor-sample --json > scan.json
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" context repo-doctor-sample 'app.py::answer' --max-lines 5
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" impact repo-doctor-sample 'app.py::answer'
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" validate repo-doctor-sample findings.json
          env -u DEEPSEEK_API_KEY "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" diagnose repo-doctor-sample 'app.py::answer' --preview > request-preview.json
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" -m json.tool request-preview.json > /dev/null
          RD="$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor"
          "$RD" demo create --out "$RUNNER_TEMP/repo-doctor-demo"
          "$RD" report create "$RUNNER_TEMP/repo-doctor-demo" --out "$RUNNER_TEMP/repo-doctor-case"
          "$RD" issue "$RUNNER_TEMP/repo-doctor-case" S-001
          if "$RD" verify "$RUNNER_TEMP/repo-doctor-case" S-001 --phase before -- python -m unittest -q test_regression; then
            echo "expected the controlled pre-fix regression to fail" >&2
            exit 1
          fi
          python -c "from pathlib import Path; Path('$RUNNER_TEMP/repo-doctor-demo/app.py').write_text('def answer():\\n    return 42\\n', encoding='utf-8')"
          "$RD" verify "$RUNNER_TEMP/repo-doctor-case" S-001 --phase after -- python -m unittest -q test_regression
          "$RD" issue "$RUNNER_TEMP/repo-doctor-case" S-001 --status resolved --note 'CI sample fix and regression' --related-test
          "$RD" report show "$RUNNER_TEMP/repo-doctor-case" > "$RUNNER_TEMP/final-report.md"
          grep -q '有修复证据' "$RUNNER_TEMP/final-report.md"
          cp "$GITHUB_WORKSPACE/tools/validate_release_install.py" "$RUNNER_TEMP/validate_release_install.py"
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" "$RUNNER_TEMP/validate_release_install.py" \
            --python "$RUNNER_TEMP/repo-doctor-venv/bin/python" \
            --cli "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" \
            --expected-version "$RD_EXPECTED_VERSION" \
            --out "$RUNNER_TEMP/installed-release-evidence"
          python "$GITHUB_WORKSPACE/tools/validate_js_ts_install.py" --mode base \
            --python "$RUNNER_TEMP/repo-doctor-venv/bin/python" \
            --cli "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" \
            --expected-version "$RD_EXPECTED_VERSION" \
            --out "$RUNNER_TEMP/installed-base-preview-evidence"
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" "$GITHUB_WORKSPACE/tools/validate_v1_install.py" --mode base \
            --python "$RUNNER_TEMP/repo-doctor-venv/bin/python" \
            --cli "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" \
            --expected-version "$RD_EXPECTED_VERSION" --out "$RUNNER_TEMP/installed-v1-base-evidence"
      - name: Preserve installed base evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-base-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/machine.json
            ${{ runner.temp }}/installed-release-evidence
            ${{ runner.temp }}/installed-base-preview-evidence
            ${{ runner.temp }}/installed-v1-base-evidence

  js-preview:
    needs: native-grammars
    name: JS extra Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runner identity
        run: |
          uname -a
          python -c "import json,platform,sys; print(json.dumps({'python':sys.version,'platform':platform.platform(),'machine':platform.machine()}))" > "$RUNNER_TEMP/machine.json"
          cat "$RUNNER_TEMP/machine.json"
      - name: Download the checked native wheel bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-grammar-bundle
          path: ${{ runner.temp }}/native-download
      - name: Verify and extract native bundle
        run: |
          (cd "$RUNNER_TEMP/native-download" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c jsx-backend-wheels-0.1.0.zip.sha256; else shasum -a 256 -c jsx-backend-wheels-0.1.0.zip.sha256; fi)
          python -m zipfile -e "$RUNNER_TEMP/native-download/jsx-backend-wheels-0.1.0.zip" "$RUNNER_TEMP/native-wheels"
      - name: Install and verify native optional backend
        run: |
          python -m pip install --no-index --only-binary=:all: --find-links "$RUNNER_TEMP/native-wheels" ai-repo-doctor-grammars==0.1.0
          python -m pip install '.[js]'
          python -c "import tree_sitter, ai_repo_doctor_grammars, tree_sitter_typescript"
      - name: Run JS contracts without skipped tests
        run: |
          python - <<'PY'
          import unittest
          modules = ['tests.test_languages', 'tests.test_js_ts', 'tests.test_esm', 'tests.test_index', 'tests.test_context', 'tests.test_cli', 'tests.test_agent_tools', 'tests.test_repo_map', 'tests.test_js_ts_spike', 'tests.test_js_ts_dialects', 'tests.test_jsx_ampersand', 'tests.test_source_lines', 'tests.test_analysis_limits', 'tests.test_v1_contract', 'tests.test_skill_binding', 'tests.test_public_docs']
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(modules))
          assert result.wasSuccessful() and not result.skipped, 'JS contract gate failed or skipped'
          PY
      - name: Verify independently installed extra wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          RD_EXPECTED_VERSION="$(python -c 'from repo_doctor._version import __version__; print(__version__)')"
          python -m venv "$RUNNER_TEMP/repo-doctor-js-venv"
          WHEEL=$(realpath dist/*.whl)
          "$RUNNER_TEMP/repo-doctor-js-venv/bin/python" -m pip install --no-index --only-binary=:all: --find-links "$RUNNER_TEMP/native-wheels" ai-repo-doctor-grammars==0.1.0
          "$RUNNER_TEMP/repo-doctor-js-venv/bin/python" -m pip install "$WHEEL[js]"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/validate_js_ts_install.py" --mode js \
            --python "$RUNNER_TEMP/repo-doctor-js-venv/bin/python" \
            --cli "$RUNNER_TEMP/repo-doctor-js-venv/bin/repo-doctor" \
            --expected-version "$RD_EXPECTED_VERSION" \
            --out "$RUNNER_TEMP/installed-js-preview-evidence"
          "$RUNNER_TEMP/repo-doctor-js-venv/bin/python" "$GITHUB_WORKSPACE/tools/validate_v1_install.py" --mode js \
            --python "$RUNNER_TEMP/repo-doctor-js-venv/bin/python" \
            --cli "$RUNNER_TEMP/repo-doctor-js-venv/bin/repo-doctor" \
            --expected-version "$RD_EXPECTED_VERSION" --out "$RUNNER_TEMP/installed-v1-js-evidence"
      - name: Preserve installed JS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-js-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/machine.json
            ${{ runner.temp }}/installed-js-preview-evidence
            ${{ runner.temp }}/installed-v1-js-evidence

  mac-install:
    needs: native-grammars
    name: macOS Python ${{ matrix.python-version }} (base + js)
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runner identity
        run: |
          uname -a
          python -c "import json,platform,sys; print(json.dumps({'python':sys.version,'platform':platform.platform(),'machine':platform.machine()}))" > "$RUNNER_TEMP/machine.json"
          cat "$RUNNER_TEMP/machine.json"
      - name: Download the checked native wheel bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-grammar-bundle
          path: ${{ runner.temp }}/native-download
      - name: Verify and extract native bundle
        run: |
          (cd "$RUNNER_TEMP/native-download" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c jsx-backend-wheels-0.1.0.zip.sha256; else shasum -a 256 -c jsx-backend-wheels-0.1.0.zip.sha256; fi)
          python -m zipfile -e "$RUNNER_TEMP/native-download/jsx-backend-wheels-0.1.0.zip" "$RUNNER_TEMP/native-wheels"
      - name: Build and validate separate base and JS installs
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          RD_EXPECTED_VERSION="$(python -c 'from repo_doctor._version import __version__; print(__version__)')"
          RD_WHEEL="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          for RD_MODE in base js; do
            RD_ENV="$RUNNER_TEMP/repo-doctor-$RD_MODE"
            python -m venv "$RD_ENV"
            if [ "$RD_MODE" = js ]; then
              "$RD_ENV/bin/python" -m pip install --no-index --only-binary=:all: --find-links "$RUNNER_TEMP/native-wheels" ai-repo-doctor-grammars==0.1.0
              "$RD_ENV/bin/python" -m pip install "$RD_WHEEL[js]"
            else
              "$RD_ENV/bin/python" -m pip install --no-index "$RD_WHEEL"
            fi
            (cd "$RUNNER_TEMP" && "$RD_ENV/bin/python" "$GITHUB_WORKSPACE/tools/validate_v1_install.py" \
              --mode "$RD_MODE" --python "$RD_ENV/bin/python" --cli "$RD_ENV/bin/repo-doctor" \
              --expected-version "$RD_EXPECTED_VERSION" --out "$RUNNER_TEMP/installed-v1-$RD_MODE-evidence")
          done
      - name: Preserve installed macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/machine.json
            ${{ runner.temp }}/installed-v1-base-evidence
            ${{ runner.temp }}/installed-v1-js-evidence

  map-viewer:
    needs: native-grammars
    name: Offline map interaction and SVG
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Set up Node for DOM checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Download the checked native wheel bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-grammar-bundle
          path: ${{ runner.temp }}/native-download
      - name: Verify and extract native bundle
        run: |
          (cd "$RUNNER_TEMP/native-download" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c jsx-backend-wheels-0.1.0.zip.sha256; else shasum -a 256 -c jsx-backend-wheels-0.1.0.zip.sha256; fi)
          python -m zipfile -e "$RUNNER_TEMP/native-download/jsx-backend-wheels-0.1.0.zip" "$RUNNER_TEMP/native-wheels"
      - name: Check projection and actual DOM behavior
        shell: bash
        run: |
          node tests/test_map_viewer.js
          node tests/test_map_search.js
          npm install --prefix "$RUNNER_TEMP/map-dom-deps" --ignore-scripts --no-audit --no-fund jsdom@30.1.1
          python tests/make_map_fixture.py "$RUNNER_TEMP/map-fixture"
          python -m repo_doctor map "$RUNNER_TEMP/map-fixture" --out "$RUNNER_TEMP/map-artifacts"
          node tests/test_map_dom.js "$RUNNER_TEMP/map-artifacts/map.html" "$RUNNER_TEMP/map-dom-deps/node_modules/jsdom"
          python -m pip install --no-index --only-binary=:all: --find-links "$RUNNER_TEMP/native-wheels" ai-repo-doctor-grammars==0.1.0
          python -m pip install '.[js]'
          python tests/make_map_fixture.py "$RUNNER_TEMP/mixed-map-fixture" --mixed
          python -m repo_doctor map "$RUNNER_TEMP/mixed-map-fixture" --languages python,javascript,typescript --out "$RUNNER_TEMP/mixed-map-artifacts"
          node tests/test_map_dom.js "$RUNNER_TEMP/mixed-map-artifacts/map.html" "$RUNNER_TEMP/map-dom-deps/node_modules/jsdom" --mixed
