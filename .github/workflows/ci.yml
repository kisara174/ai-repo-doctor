name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile project modules
        run: python -m compileall -q repo_doctor tools

      - name: Check CLI help
        run: python -m repo_doctor --help

      - name: Check diagnosis CLI help
        run: python -m repo_doctor diagnose --help

      - name: Check diagnosis evaluation CLI help
        run: |
          python -m tools.evaluate_diagnosis prepare --help
          python -m tools.evaluate_diagnosis run --help
          python -m tools.evaluate_diagnosis prepare-review --help
          python -m tools.evaluate_diagnosis score --help

      - name: Build and smoke-test installed wheel
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/repo-doctor-venv"
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" -m pip install --no-index dist/*.whl
          mkdir "$RUNNER_TEMP/repo-doctor-sample"
          printf 'def answer():\n    return 42\n' > "$RUNNER_TEMP/repo-doctor-sample/app.py"
          printf '[]\n' > "$RUNNER_TEMP/findings.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" --help
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" scan repo-doctor-sample --json > scan.json
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" context repo-doctor-sample 'app.py::answer' --max-lines 5
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" impact repo-doctor-sample 'app.py::answer'
          "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" validate repo-doctor-sample findings.json
          env -u DEEPSEEK_API_KEY "$RUNNER_TEMP/repo-doctor-venv/bin/repo-doctor" diagnose repo-doctor-sample 'app.py::answer' --preview > request-preview.json
          "$RUNNER_TEMP/repo-doctor-venv/bin/python" -m json.tool request-preview.json > /dev/null
